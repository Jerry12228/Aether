version: 0.1.0+0
resolution: workspace
environment:
  sdk: '>=3.12.0 <3.13.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      windows:
        pluginClass: SeleneNativePluginCApi
